<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ROI Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="back" class="icon" aria-label="Back" hidden>&larr;</button>
  <h1 id="title">ROI Tracker</h1>
  <button id="menu-btn" class="icon" aria-label="Backup menu">&#8943;</button>
</header>
<div id="banner" class="banner" hidden></div>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<dialog id="menu">
  <h2>Backup</h2>
  <p class="muted">Backup files contain your personal data. Don't commit them to git.</p>
  <button id="export" class="btn">Export backup JSON</button>
  <label class="btn secondary">Import backup JSON
    <input id="import" type="file" accept="application/json,.json" hidden>
  </label>
  <button id="open-feedback" class="btn secondary">Feedback notes</button>
  <button id="menu-close" class="btn ghost">Close</button>
</dialog>

<dialog id="feedback">
  <h2>Feedback notes</h2>
  <p class="muted">Jot ideas and bugs as you use the app. Copy them all and paste to Claude as one batch.</p>
  <form id="fb-form">
    <label class="field">Type
      <select name="kind"><option value="idea">Idea</option><option value="bug">Bug</option></select>
    </label>
    <label class="field">Note
      <textarea name="text" rows="3" maxlength="500" required></textarea>
    </label>
    <button class="btn" type="submit">Add note</button>
  </form>
  <ul id="fb-list" class="hist"></ul>
  <button id="fb-copy" class="btn secondary">Copy all</button>
  <button id="fb-clear" class="btn danger">Clear all</button>
  <button id="fb-close" class="btn ghost">Close</button>
</dialog>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
