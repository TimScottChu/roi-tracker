<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ROI Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="back" class="icon" aria-label="Back" hidden>&larr;</button>
  <h1 id="title">ROI Tracker</h1>
  <button id="menu-btn" class="icon" aria-label="Backup menu">&#8943;</button>
</header>
<div id="banner" class="banner" hidden></div>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<dialog id="menu">
  <h2>Backup</h2>
  <p class="muted">Backup files contain your personal data. Don't commit them to git.</p>
  <button id="export" class="btn">Export backup JSON</button>
  <label class="btn secondary">Import backup JSON
    <input id="import" type="file" accept="application/json,.json" hidden>
  </label>
  <button id="menu-close" class="btn ghost">Close</button>
</dialog>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
